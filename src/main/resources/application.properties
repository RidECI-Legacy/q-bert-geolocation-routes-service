spring.application.name=q-bert-geolocation-routes-service

tomtom.api-key=${TOMTOM_API_KEY}
tomtom.base-url=https://api.tomtom.com

resilience4j.circuitbreaker.instances.tomtom.sliding-window-size=10
resilience4j.circuitbreaker.instances.tomtom.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tomtom.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.tomtom.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.tomtom.max-attempts=3
resilience4j.retry.instances.tomtom.wait-duration=200ms

resilience4j.timelimiter.instances.tomtom.timeout-duration=3s
