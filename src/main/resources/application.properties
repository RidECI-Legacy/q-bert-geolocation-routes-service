spring.application.name=q-bert-geolocation-routes-service

tomtom.api-key=${TOMTOM_API_KEY}
tomtom.base-url=https://api.tomtom.com

resilience4j.circuitbreaker.instances.tomtom.sliding-window-size=10
resilience4j.circuitbreaker.instances.tomtom.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tomtom.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.tomtom.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.tomtom.max-attempts=3
resilience4j.retry.instances.tomtom.wait-duration=200ms

resilience4j.timelimiter.instances.tomtom.timeout-duration=3s

# Pending real endpoint contract; adapter calls are stubbed until then (see OtpAdapter/GtfsRealtimeAdapter).
otp.base-url=${OTP_BASE_URL:}

gtfs-realtime.feed-url=${GTFS_REALTIME_FEED_URL:}
gtfs-realtime.poll-interval=${GTFS_REALTIME_POLL_INTERVAL:15s}

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/q-bert-geolocation-routes-service}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms

server.port=${SERVER_PORT:8080}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
